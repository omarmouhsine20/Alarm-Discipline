<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">        
        <title>Discipline.Alarm</title>
        <link rel="stylesheet" href="output.css">
    </head>
   <body class="min-h-screen bg-[#0B1120] text-white font-sans">

    
    <nav class="flex items-center justify-between px-8 py-5 border-b border-white/10">
        <h1 class="text-xl font-bold tracking-wide">
            Discipline<span class="text-purple-500">Alarm</span>
        </h1>

        <div class="flex items-center gap-6 text-sm text-gray-400">
            <a href="#" class="text-white hover:text-purple-400 transition">Dashboard</a>
            <a href="#" class="hover:text-purple-400 transition">History</a>
            <a href="#" class="hover:text-purple-400 transition">Settings</a>
        </div>
    </nav>


    
    <main class="max-w-5xl mx-auto px-6 py-10 space-y-8">


        <!-- Clock Section -->
        <section class="bg-[#151F32] border border-white/5 rounded-3xl p-10 text-center shadow-lg">

            <p id="currentDate" class="text-cyan-400 uppercase tracking-[0.3em] text-xs font-semibold">
                Monday, November 23
            </p>

            <h2 class="text-6xl font-bold tracking-tight mt-4">
                <span id="currentTime">12:27</span>
                <span class="text-cyan-400 text-3xl">AM</span>
            </h2>

            <p class="text-gray-400 mt-3">
                Time to take control.
            </p>

        </section>


        <!-- Set Alarm Card -->
        <section class="bg-[#151F32] border border-white/5 rounded-3xl p-8 space-y-6">

            <h2 class="text-xl font-semibold text-center">
                Set Your Alarm
            </h2>

            <input
                type="time"
                id="alarmTime"
                class="w-full bg-[#0B1120] border border-white/10 rounded-xl px-4 py-4 text-white focus:outline-none focus:border-purple-500 transition"
            >

            <button
                id="setAlarmBtn"
                class="w-full bg-purple-600 hover:bg-purple-500 active:scale-[0.98] transition rounded-xl py-4 font-semibold shadow-lg shadow-purple-900/20"
            >
                Set Alarm
            </button>

            <p id="alarmStatus" class="text-gray-400 text-center text-sm">
                No alarm set
            </p>

        </section>


        
        <section id="challenge" class="bg-[#151F32] border border-white/5 rounded-3xl p-8 text-center space-y-5">

            <div class="w-16 h-16 mx-auto rounded-2xl bg-purple-500/10 flex items-center justify-center text-3xl">
                🔔
            </div>

            <h2 class="text-cyan-400 font-semibold tracking-widest text-sm">
                WAKE-UP MISSION
            </h2>

            <h3 class="text-2xl font-bold">
                Earn your morning.
            </h3>

            <p class="text-gray-400 text-sm">
                Solve your word challenge to stop the alarm.
            </p>

            <input
                type="text"
                id="wordInput"
                placeholder="Type your word..."
                autocomplete="off"
                class="w-full bg-[#0B1120] border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition"
            >

            <button
                id="stopAlarmBtn"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-[#0B1120] font-bold rounded-xl py-4 transition active:scale-[0.98]"
            >
                Stop Alarm
            </button>
            <p id="errorMessage" class="text-red-400 text-sm"></p>
        </section>

        <footer class="text-center text-gray-600 text-sm py-6">
            Wake up · Show up · Never give up.
        </footer>

    </main>
<script src="script.js"></script>
</body>
</html>
